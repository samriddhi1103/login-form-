<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background: #f1e0d07c;
        }

        .bi {
            position: relative;

        }

        .mb {
            background-color: #FD8594;
            width: 15vw;
            height: 100vh;
            position: absolute;
            left: 550px;
            border-radius: 10px;
            /* border: 2px dashed white; */

        }

        .rb {
            position: absolute;
            background-color: #FDECDD;
            width: 60vw;
            height: 60vh;
            top: 140px;
            left: 19vw;
            border: 1px solid rgb(243, 238, 238);
            box-shadow: 0px 0px 50px rgba(53, 52, 52, 0.308);
            border-radius: 10px;
        }

        .img {
            background-image: url(pinkimg.jpg);
            width: 250px;
            height: 385px;
            position: absolute;
            /* top: 0px; */
            /* border: 2.3px dashed whitesmoke; */
            background-size: cover;
            right: 0;
        }
    </style>
</head>

<body>

    <div class="bi">
        <div class="mb"></div>
    </div>
    <div class="rb">
        <div class="img"></div>
    </div>
</body>

</html>
